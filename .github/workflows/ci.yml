name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Full test gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:.data/ci.sqlite
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHON: python

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libglew-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            pkg-config \
            restic

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Install Python test dependencies
        run: python -m pip install ".[test]"

      - name: Run full test gate
        run: npm run check

      - name: Add coverage summary to job
        if: ${{ !cancelled() }}
        run: |
          if [[ -f coverage/summary.md ]]; then
            cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload critical-module coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: critical-module-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
